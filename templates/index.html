<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Android Board Dashboard</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/gridstack@10.3.1/dist/gridstack.min.css" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark"></span>
      <div>
        <h1>Android Board Dashboard</h1>
        <p class="subtitle">工作站监测控制台</p>
      </div>
    </div>
    <div class="status-group" id="status-group">
      <div class="status-pill" id="status-adb" data-state="unknown">
        <span class="dot"></span>
        <span class="label">ADB</span>
        <span class="detail">检测中…</span>
      </div>
      <div class="status-pill" id="status-hdmi" data-state="unknown">
        <span class="dot"></span>
        <span class="label">HDMI 采集</span>
        <span class="detail">检测中…</span>
      </div>
    </div>
    <div class="topbar-actions">
      <div class="add-panel-wrap">
        <button type="button" class="btn" id="btn-add-panel">添加面板</button>
        <div class="menu" id="add-panel-menu" hidden>
          <button type="button" data-panel="remote">遥控器</button>
          <button type="button" data-panel="hdmi">HDMI 输出监测</button>
        </div>
      </div>
      <button type="button" class="btn btn-ghost" id="btn-refresh-status">刷新状态</button>
    </div>
  </header>

  <main class="workspace">
    <div class="grid-stack" id="dashboard-grid"></div>
  </main>

  <template id="tpl-panel-shell">
    <div class="panel">
      <div class="panel-header">
        <span class="panel-title"></span>
        <div class="panel-actions">
          <button type="button" class="icon-btn" data-action="close" title="关闭">✕</button>
        </div>
      </div>
      <div class="panel-body"></div>
    </div>
  </template>

  <template id="tpl-remote">
    <div class="remote">
      <div class="remote-photo-wrap" aria-label="Android TV 遥控器">
        <img
          class="remote-photo"
          src="/static/img/remote.png"
          alt="遥控器"
          draggable="false"
        />
        <!-- Hotspots mapped to physical remote buttons (percent of image) -->
        <button type="button" class="hotspot round" data-key="POWER" title="电源" style="left:10%;top:2.8%;width:18%;height:5%;"></button>
        <button type="button" class="hotspot round" data-key="TV_INPUT" title="输入源" style="left:72%;top:2.8%;width:18%;height:5%;"></button>

        <button type="button" class="hotspot round" data-key="BOOKMARK" title="列表" style="left:10%;top:10.5%;width:18%;height:5%;"></button>
        <button type="button" class="hotspot round" data-key="ASSISTANT" title="Google 助手" style="left:34%;top:9.5%;width:32%;height:7.5%;"></button>
        <button type="button" class="hotspot round" data-key="SETTINGS" title="设置" style="left:72%;top:10.5%;width:18%;height:5%;"></button>

        <button type="button" class="hotspot pad" data-key="DPAD_UP" title="上" style="left:36%;top:20.5%;width:28%;height:6%;"></button>
        <button type="button" class="hotspot pad" data-key="DPAD_LEFT" title="左" style="left:18%;top:26.5%;width:18%;height:7.5%;"></button>
        <button type="button" class="hotspot round" data-key="DPAD_CENTER" title="确认" style="left:36%;top:26.5%;width:28%;height:7.5%;"></button>
        <button type="button" class="hotspot pad" data-key="DPAD_RIGHT" title="右" style="left:64%;top:26.5%;width:18%;height:7.5%;"></button>
        <button type="button" class="hotspot pad" data-key="DPAD_DOWN" title="下" style="left:36%;top:34%;width:28%;height:6%;"></button>

        <button type="button" class="hotspot round" data-key="BACK" title="返回" style="left:10%;top:42%;width:20%;height:5.2%;"></button>
        <button type="button" class="hotspot round" data-key="HOME" title="主页" style="left:40%;top:42%;width:20%;height:5.2%;"></button>
        <button type="button" class="hotspot round" data-key="LIVE" title="直播" style="left:70%;top:42%;width:20%;height:5.2%;"></button>

        <button type="button" class="hotspot rocker" data-key="VOLUME_UP" title="音量+" style="left:10%;top:50%;width:20%;height:4.5%;"></button>
        <button type="button" class="hotspot rocker" data-key="VOLUME_DOWN" title="音量-" style="left:10%;top:56.8%;width:20%;height:4.5%;"></button>
        <button type="button" class="hotspot round" data-key="MUTE" title="静音" style="left:40%;top:52.8%;width:20%;height:5.2%;"></button>
        <button type="button" class="hotspot rocker" data-key="CHANNEL_UP" title="频道+" style="left:70%;top:50%;width:20%;height:4.5%;"></button>
        <button type="button" class="hotspot rocker" data-key="CHANNEL_DOWN" title="频道-" style="left:70%;top:56.8%;width:20%;height:4.5%;"></button>

        <button type="button" class="hotspot app" data-key="YOUTUBE" title="YouTube" style="left:8%;top:65.8%;width:40%;height:4.5%;"></button>
        <button type="button" class="hotspot app" data-key="NETFLIX" title="Netflix" style="left:52%;top:65.8%;width:40%;height:4.5%;"></button>
        <button type="button" class="hotspot app" data-key="PRIME" title="Prime Video" style="left:8%;top:71.2%;width:40%;height:4.5%;"></button>
        <button type="button" class="hotspot app" data-key="DISNEY" title="Disney+" style="left:52%;top:71.2%;width:40%;height:4.5%;"></button>
      </div>
      <p class="remote-feedback" id="remote-feedback"></p>
    </div>
  </template>

  <template id="tpl-hdmi">
    <div class="hdmi">
      <div class="hdmi-controls">
        <label>
          分辨率
          <select id="hdmi-resolution">
            <option value="1280x720">1280 × 720</option>
            <option value="1920x1080" selected>1920 × 1080</option>
          </select>
        </label>
        <label class="checkbox">
          <input type="checkbox" id="hdmi-audio" checked />
          音频
        </label>
        <button type="button" class="btn" id="hdmi-start">开始监测</button>
        <button type="button" class="btn btn-ghost" id="hdmi-stop" disabled>停止</button>
        <button type="button" class="btn btn-ghost" id="hdmi-unmute" hidden>取消静音</button>
      </div>
      <div class="hdmi-bandwidth" id="hdmi-bandwidth">网络带宽加载中…</div>
      <div class="hdmi-stage">
        <video id="hdmi-video" autoplay playsinline muted></video>
        <div class="hdmi-overlay" id="hdmi-overlay">未开始</div>
      </div>
      <p class="hdmi-status" id="hdmi-status">等待操作</p>
    </div>
  </template>

  <script src="https://cdn.jsdelivr.net/npm/gridstack@10.3.1/dist/gridstack-all.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/socket.io-client@4.7.5/dist/socket.io.min.js"></script>
  <script src="{{ url_for('static', filename='js/remote.js') }}"></script>
  <script src="{{ url_for('static', filename='js/hdmi.js') }}"></script>
  <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
</body>
</html>
