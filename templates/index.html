<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Android Board Dashboard</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/gridstack@10.3.1/dist/gridstack.min.css" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark"></span>
      <div>
        <h1>Android Board Dashboard</h1>
        <p class="subtitle">工作站监测控制台</p>
      </div>
    </div>
    <div class="status-group" id="status-group">
      <div class="status-pill" id="status-adb" data-state="unknown">
        <span class="dot"></span>
        <span class="label">ADB</span>
        <span class="detail">检测中…</span>
      </div>
      <div class="status-pill" id="status-hdmi" data-state="unknown">
        <span class="dot"></span>
        <span class="label">HDMI 采集</span>
        <span class="detail">检测中…</span>
      </div>
    </div>
    <div class="topbar-actions">
      <div class="add-panel-wrap">
        <button type="button" class="btn" id="btn-add-panel">添加面板</button>
        <div class="menu" id="add-panel-menu" hidden>
          <button type="button" data-panel="hwc-status">IComposer - VPU</button>
          <button type="button" data-panel="sf-events">SurfaceFlinger - events</button>
          <button type="button" data-panel="sf-frametimeline">SurfaceFlinger - frametimeline</button>
          <button type="button" data-panel="hwc">SurfaceFlinger - hwclayers</button>
          <button type="button" data-panel="ddr">内存带宽</button>
          <button type="button" data-panel="proc-meminfo">proc - meminfo</button>
          <button type="button" data-panel="hdmi">操作台</button>
          <button type="button" data-panel="adb-text">输入</button>
          <button type="button" data-panel="remote">遥控器</button>
        </div>
      </div>
      <button type="button" class="btn" id="btn-pause-toggle" data-paused="0" title="暂停 / 继续（空格）">暂停</button>
    </div>
  </header>

  <main class="workspace">
    <div class="grid-stack" id="dashboard-grid"></div>
  </main>

  <template id="tpl-panel-shell">
    <div class="panel">
      <div class="panel-header">
        <span class="panel-title"></span>
        <div class="panel-actions">
          <button type="button" class="icon-btn" data-action="close" title="关闭">✕</button>
        </div>
      </div>
      <div class="panel-body"></div>
    </div>
  </template>

  <template id="tpl-remote">
    <div class="remote">
      <div class="remote-scale">
        <div class="remote-photo-wrap" aria-label="Android TV 遥控器">
          <img
            class="remote-photo"
            src="/static/img/remote.png"
            alt="遥控器"
            width="262"
            height="950"
            draggable="false"
          />
          <!-- Hotspots: percent of image box (same aspect as remote.png 262×950) -->
          <button type="button" class="hotspot round" data-key="POWER" title="电源" style="left:12%;top:3.3%;width:16%;height:4.8%;"></button>
          <button type="button" class="hotspot round" data-key="TV_INPUT" title="输入源" style="left:72%;top:3.3%;width:16%;height:4.8%;"></button>

          <button type="button" class="hotspot round" data-key="BOOKMARK" title="列表" style="left:11%;top:13.5%;width:22%;aspect-ratio:1;height:auto;"></button>
          <button type="button" class="hotspot round" data-key="ASSISTANT" title="Google 助手" style="left:36.5%;top:10.6%;width:27%;height:7%;"></button>
          <button type="button" class="hotspot round" data-key="SETTINGS" title="设置" style="left:67%;top:13.5%;width:22%;aspect-ratio:1;height:auto;"></button>

          <button type="button" class="hotspot pad" data-key="DPAD_UP" title="上" style="left:34%;top:18.7%;width:31%;height:6%;"></button>
          <button type="button" class="hotspot pad" data-key="DPAD_LEFT" title="左" style="left:15%;top:24.6%;width:20%;height:9.3%;"></button>
          <button type="button" class="hotspot round" data-key="DPAD_CENTER" title="确认" style="left:37%;top:25.4%;width:25%;height:7.6%;"></button>
          <button type="button" class="hotspot pad" data-key="DPAD_RIGHT" title="右" style="left:65%;top:24.6%;width:20%;height:9.3%;"></button>
          <button type="button" class="hotspot pad" data-key="DPAD_DOWN" title="下" style="left:34%;top:33.8%;width:31%;height:6%;"></button>

          <button type="button" class="hotspot round" data-key="BACK" title="返回" style="left:12.5%;top:39.2%;width:20%;height:5.8%;"></button>
          <button type="button" class="hotspot round" data-key="HOME" title="主页" style="left:38%;top:41%;width:24%;height:6.5%;"></button>
          <button type="button" class="hotspot round" data-key="LIVE" title="直播" style="left:67.5%;top:39.2%;width:20%;height:5.8%;"></button>

          <button type="button" class="hotspot rocker" data-key="VOLUME_UP" title="音量+" style="left:10%;top:48.8%;width:24%;height:7.2%;"></button>
          <button type="button" class="hotspot rocker" data-key="VOLUME_DOWN" title="音量-" style="left:10%;top:56%;width:24%;height:7.2%;"></button>
          <button type="button" class="hotspot round" data-key="MUTE" title="静音" style="left:38%;top:53.6%;width:24%;height:7%;"></button>
          <button type="button" class="hotspot rocker" data-key="CHANNEL_UP" title="频道+" style="left:66%;top:48.8%;width:24%;height:7.2%;"></button>
          <button type="button" class="hotspot rocker" data-key="CHANNEL_DOWN" title="频道-" style="left:66%;top:56%;width:24%;height:7.2%;"></button>

          <button type="button" class="hotspot app" data-key="YOUTUBE" title="YouTube" style="left:9%;top:65.7%;width:38%;height:5.5%;"></button>
          <button type="button" class="hotspot app" data-key="NETFLIX" title="Netflix" style="left:52%;top:65.6%;width:38%;height:5.5%;"></button>
          <button type="button" class="hotspot app" data-key="PRIME" title="Prime Video" style="left:9%;top:71.4%;width:38%;height:5.5%;"></button>
          <button type="button" class="hotspot app" data-key="DISNEY" title="Disney+" style="left:52%;top:71.3%;width:38%;height:5.5%;"></button>
        </div>
      </div>
      <p class="remote-feedback" id="remote-feedback"></p>
    </div>
  </template>

  <template id="tpl-adb-text">
    <div class="adb-text">
      <div class="adb-text-row">
        <input
          type="text"
          id="adb-text-input"
          class="adb-text-input"
          placeholder="输入要发送到设备的文本"
          autocomplete="off"
          spellcheck="false"
        />
        <button type="button" id="adb-text-send" class="btn">发送</button>
      </div>
      <p class="adb-text-status" id="adb-text-status"></p>
    </div>
  </template>

  <template id="tpl-hdmi">
    <div class="hdmi">
      <div class="hdmi-controls">
        <label>
          分辨率
          <select id="hdmi-resolution">
            <option value="1280x720">1280 × 720</option>
            <option value="1920x1080" selected>1920 × 1080</option>
          </select>
        </label>
        <label class="checkbox">
          <input type="checkbox" id="hdmi-audio" checked />
          音频
        </label>
        <button type="button" class="btn" id="hdmi-toggle" data-running="0">开始</button>
        <button type="button" class="btn btn-ghost" id="hdmi-unmute" hidden>取消静音</button>
      </div>
      <div class="hdmi-bandwidth" id="hdmi-bandwidth">网络带宽加载中…</div>
      <div class="hdmi-stage">
        <video id="hdmi-video" autoplay playsinline muted></video>
        <div class="hdmi-overlay" id="hdmi-overlay">未开始</div>
      </div>
      <p class="hdmi-status" id="hdmi-status">等待操作</p>
      <p class="hdmi-key-feedback" id="hdmi-key-feedback">键盘：方向/确认/返回/音量 · P电源 B列表 A助手 S设置 H主页 M静音</p>
    </div>
  </template>

  <template id="tpl-ddr">
    <div class="ddr">
      <div class="ddr-track-toggles" id="ddr-track-toggles" aria-label="曲线图开关">
        <button type="button" class="ddr-track-btn" data-track="total" aria-pressed="true">total</button>
        <button type="button" class="ddr-track-btn" data-track="cpu" aria-pressed="true">cpu_a55_main</button>
        <button type="button" class="ddr-track-btn" data-track="gpu" aria-pressed="true">gpu</button>
        <button type="button" class="ddr-track-btn" data-track="vpu" aria-pressed="true">vpu</button>
        <button type="button" class="ddr-track-btn" data-track="audio" aria-pressed="false">audio</button>
        <button type="button" class="ddr-track-btn" data-track="vdec" aria-pressed="false">vdec_4k</button>
        <button type="button" class="ddr-track-btn" data-track="vdec2k" aria-pressed="false">vdec_2k_jpeg</button>
        <button type="button" class="ddr-track-btn" data-track="emmc" aria-pressed="false">emmc_sd</button>
        <button type="button" class="ddr-track-btn" data-track="usbpcie" aria-pressed="false">usb_pcie</button>
        <button type="button" class="ddr-track-btn" data-track="phyeth" aria-pressed="false">phy_eth_dac</button>
      </div>
      <div class="ddr-charts">
        <section class="ddr-chart-block" data-track="total">
          <div class="ddr-meta ddr-meta-total" id="ddr-meta-total">total · —</div>
          <div class="ddr-chart-wrap">
            <canvas id="ddr-chart-total" aria-label="使能通道带宽总和曲线"></canvas>
          </div>
        </section>
        <section class="ddr-chart-block" data-track="cpu">
          <div class="ddr-meta" id="ddr-meta-cpu">等待采样…</div>
          <div class="ddr-chart-wrap">
            <canvas id="ddr-chart-cpu" aria-label="cpu_a55_main 内存带宽曲线"></canvas>
          </div>
        </section>
        <section class="ddr-chart-block" data-track="gpu">
          <div class="ddr-meta ddr-meta-gpu" id="ddr-meta-gpu">gpu · —</div>
          <div class="ddr-chart-wrap">
            <canvas id="ddr-chart-gpu" aria-label="gpu 内存带宽曲线"></canvas>
          </div>
        </section>
        <section class="ddr-chart-block" data-track="vpu">
          <div class="ddr-meta ddr-meta-vpu" id="ddr-meta-vpu">vpu · —</div>
          <div class="ddr-chart-wrap">
            <canvas id="ddr-chart-vpu" aria-label="vpu 内存带宽曲线"></canvas>
          </div>
        </section>
        <section class="ddr-chart-block" data-track="audio" hidden>
          <div class="ddr-meta ddr-meta-audio" id="ddr-meta-audio">audio · —</div>
          <div class="ddr-chart-wrap">
            <canvas id="ddr-chart-audio" aria-label="audio 内存带宽曲线"></canvas>
          </div>
        </section>
        <section class="ddr-chart-block" data-track="vdec" hidden>
          <div class="ddr-meta ddr-meta-vdec" id="ddr-meta-vdec">vdec_4k · —</div>
          <div class="ddr-chart-wrap">
            <canvas id="ddr-chart-vdec" aria-label="vdec_4k 内存带宽曲线"></canvas>
          </div>
        </section>
        <section class="ddr-chart-block" data-track="vdec2k" hidden>
          <div class="ddr-meta ddr-meta-vdec2k" id="ddr-meta-vdec2k">vdec_2k_jpeg · —</div>
          <div class="ddr-chart-wrap">
            <canvas id="ddr-chart-vdec2k" aria-label="vdec_2k_jpeg 内存带宽曲线"></canvas>
          </div>
        </section>
        <section class="ddr-chart-block" data-track="emmc" hidden>
          <div class="ddr-meta ddr-meta-emmc" id="ddr-meta-emmc">emmc_sd · —</div>
          <div class="ddr-chart-wrap">
            <canvas id="ddr-chart-emmc" aria-label="emmc_sd 内存带宽曲线"></canvas>
          </div>
        </section>
        <section class="ddr-chart-block" data-track="usbpcie" hidden>
          <div class="ddr-meta ddr-meta-usbpcie" id="ddr-meta-usbpcie">usb_pcie · —</div>
          <div class="ddr-chart-wrap">
            <canvas id="ddr-chart-usbpcie" aria-label="usb_pcie 内存带宽曲线"></canvas>
          </div>
        </section>
        <section class="ddr-chart-block" data-track="phyeth" hidden>
          <div class="ddr-meta ddr-meta-phyeth" id="ddr-meta-phyeth">phy_eth_dac · —</div>
          <div class="ddr-chart-wrap">
            <canvas id="ddr-chart-phyeth" aria-label="phy_eth_dac 内存带宽曲线"></canvas>
          </div>
        </section>
      </div>
      <p class="ddr-status" id="ddr-status">等待操作</p>
    </div>
  </template>

  <template id="tpl-hwc">
    <div class="hwc">
      <div class="hwc-meta" id="hwc-meta">等待采样…</div>
      <div class="hwc-stage" id="hwc-stage">
        <canvas id="hwc-canvas" aria-label="HWC 图层爆炸轴测图"></canvas>
      </div>
      <div class="hwc-legend-wrap">
        <div class="hwc-legend-title">图例 · 轴测爆炸 · 实线 DEVICE / 虚线 CLIENT</div>
        <div class="hwc-legend" id="hwc-legend"></div>
      </div>
      <p class="hwc-status" id="hwc-status">等待操作</p>
    </div>
  </template>

  <template id="tpl-hwc-status">
    <div class="hwc-st">
      <div class="hwc-st-meta" id="hwc-st-meta">等待采样…</div>
      <div class="hwc-st-stage" id="hwc-st-stage">
        <canvas id="hwc-st-canvas" aria-label="HWC 层 VPU View 爆炸轴测图"></canvas>
      </div>
      <div class="hwc-legend-wrap">
        <div class="hwc-legend-title">图例 · ID / Content / Comp / VPU / Format / Alpha · 实线 DEVICE / 虚线 CLIENT</div>
        <div class="hwc-legend" id="hwc-st-legend"></div>
      </div>
      <p class="hwc-st-status" id="hwc-st-status">等待操作</p>
    </div>
  </template>

  <template id="tpl-sf-events">
    <div class="sf-events">
      <div class="sf-events-meta" id="sf-events-meta">等待采样…</div>
      <div class="sf-events-chart-wrap">
        <canvas id="sf-events-chart" aria-label="SurfaceFlinger events 时序曲线"></canvas>
      </div>
      <p class="sf-events-status" id="sf-events-status">等待操作</p>
    </div>
  </template>

  <template id="tpl-sf-frametimeline">
    <div class="sf-ftl">
      <div class="sf-ftl-meta" id="sf-ftl-meta">等待采样…</div>
      <div class="sf-ftl-stage" id="sf-ftl-stage">
        <canvas id="sf-ftl-canvas" aria-label="SurfaceFlinger FrameTimeline 帧序列柱状图"></canvas>
      </div>
      <div class="sf-ftl-legend" id="sf-ftl-legend">
        <span class="sf-ftl-legend-item"><span class="sf-ftl-swatch expected"></span>Expected Start→Present</span>
        <span class="sf-ftl-legend-item"><span class="sf-ftl-swatch actual"></span>Actual Start→Present</span>
        <span class="sf-ftl-legend-item"><span class="sf-ftl-swatch jank"></span>Jank</span>
      </div>
      <div class="sf-ftl-detail" id="sf-ftl-detail">
        <div class="sf-ftl-detail-empty">点击柱状图中的某一帧查看 Layer 明细</div>
      </div>
      <p class="sf-ftl-status" id="sf-ftl-status">等待操作</p>
    </div>
  </template>

  <template id="tpl-meminfo">
    <div class="meminfo">
      <div class="meminfo-meta" id="meminfo-meta">等待采样…</div>
      <div class="meminfo-chart-wrap">
        <canvas id="meminfo-chart" aria-label="/proc/meminfo 内存曲线"></canvas>
      </div>
      <p class="meminfo-status" id="meminfo-status">等待操作</p>
    </div>
  </template>

  <script src="https://cdn.jsdelivr.net/npm/gridstack@10.3.1/dist/gridstack-all.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/socket.io-client@4.7.5/dist/socket.io.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <script src="{{ url_for('static', filename='js/remote.js') }}"></script>
  <script src="{{ url_for('static', filename='js/adb-text.js') }}"></script>
  <script src="{{ url_for('static', filename='js/hdmi.js') }}"></script>
  <script src="{{ url_for('static', filename='js/ddr.js') }}"></script>
  <script src="{{ url_for('static', filename='js/hwc.js') }}"></script>
  <script src="{{ url_for('static', filename='js/hwc-status.js') }}"></script>
  <script src="{{ url_for('static', filename='js/sf-events.js') }}"></script>
  <script src="{{ url_for('static', filename='js/sf-frametimeline.js') }}"></script>
  <script src="{{ url_for('static', filename='js/meminfo.js') }}"></script>
  <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
</body>
</html>
